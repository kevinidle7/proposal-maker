<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>A Special Proposal ❤️</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #fff0f5,
        #ffe1eb
      );
      color: #333;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: none;
      padding: 25px 18px 60px;
    }

    .page.active {
      display: block;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .hero {
      text-align: center;
      padding: 30px 10px;
    }

    .heart {
      font-size: 55px;
      animation: heartbeat 1.3s infinite;
    }

    @keyframes heartbeat {

      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }

    }

    h1 {
      color: #e91e63;
      font-size: 32px;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 22px;
      box-shadow:
        0 8px 25px rgba(0,0,0,0.08);
    }

    h2 {
      color: #e91e63;
    }

    #message {
      font-size: 18px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .reason {
      background: #fff0f5;
      padding: 14px;
      margin: 10px 0;
      border-radius: 14px;
      text-align: left;
      font-size: 16px;
    }

    .photos {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .photo {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 18px;
      display: none;
    }

    .continue-area {
      text-align: center;
      margin-top: 30px;
    }

    .continue {
      border: none;
      padding: 16px 35px;
      border-radius: 30px;
      background: #e91e63;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      box-shadow:
        0 8px 20px rgba(233,30,99,0.25);
    }

    .continue:hover {
      transform: scale(1.05);
    }


    /* PAGE 2 */

    .question-page {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .question-container {
      width: 100%;
      max-width: 700px;
    }

    .question-title {
      font-size: 42px;
      color: #e91e63;
      margin-bottom: 50px;
    }

    .buttons {
      position: relative;
      min-height: 250px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 30px;
    }

    button {
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      transition:
        transform 0.3s ease,
        font-size 0.3s ease,
        padding 0.3s ease;
    }

    .yes {
      background: #e91e63;
      color: white;

      font-size: 28px;
      padding: 22px 55px;

      box-shadow:
        0 10px 30px rgba(233,30,99,0.3);
    }

    .no {
      background: #ddd;
      color: #333;

      font-size: 22px;
      padding: 18px 40px;
    }


    /* SUCCESS */

    #successPage {
      text-align: center;
    }

    .success-heart {
      font-size: 80px;
      animation: heartbeat 1s infinite;
    }

    .success-title {
      font-size: 52px;
      color: #e91e63;
    }

    #finalMessage {
      font-size: 21px;
      line-height: 1.7;
      white-space: pre-line;
      background: white;
      padding: 25px;
      border-radius: 22px;
      box-shadow:
        0 8px 25px rgba(0,0,0,0.08);
    }

    .floating {
      position: fixed;
      pointer-events: none;
      animation: floatUp 5s linear forwards;
      font-size: 25px;
      z-index: 999;
    }

    @keyframes floatUp {

      from {
        transform: translateY(0);
        opacity: 1;
      }

      to {
        transform: translateY(-100vh);
        opacity: 0;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     PAGE 1
========================= -->

<section
  id="page1"
  class="page active">

  <div class="container">


    <div class="hero">

      <div class="heart">
        ❤️
      </div>

      <h1>

        A Special Message For
        <span id="name">You</span>

      </h1>

    </div>


    <div class="card">

      <h2>
        💌 Something I Want To Tell You
      </h2>

      <p id="message">
        Loading your special message... ❤️
      </p>

    </div>


    <div class="card">

      <h2>
        ❤️ Reasons
      </h2>

      <div id="reasons">
        <p>
          Loading reasons... ❤️
        </p>
      </div>

    </div>


    <div class="card">

      <h2>
        📸 Memories
      </h2>

      <div class="photos">

        <img
          id="photo1"
          class="photo">

        <img
          id="photo2"
          class="photo">

        <img
          id="photo3"
          class="photo">

      </div>

    </div>


    <div class="continue-area">

      <button
        class="continue"
        onclick="showQuestion()">

        Continue ❤️

      </button>

    </div>


  </div>

</section>



<!-- =========================
     PAGE 2
========================= -->

<section
  id="page2"
  class="page question-page">

  <div class="question-container">


    <div class="heart">
      💕
    </div>


    <h1 class="question-title">

      Will you be my girlfriend? 💕

    </h1>


    <div class="buttons">

      <button
        id="yesButton"
        class="yes"
        onclick="sayYes()">

        YES ❤️

      </button>


      <button
        id="noButton"
        class="no"
        onclick="sayNo()">

        NO

      </button>

    </div>


  </div>

</section>



<!-- =========================
     SUCCESS PAGE
========================= -->

<section
  id="successPage"
  class="page">

  <div class="container">


    <div class="hero">

      <div class="success-heart">
        💖
      </div>


      <h1 class="success-title">

        YAY!!! 🎉

      </h1>


      <p
        id="finalMessage">

        Congratulations!

      </p>


      <p style="font-size:30px;">

        ❤️ 💕 ❤️ 💕 ❤️

      </p>

    </div>


  </div>

</section>



<script type="module">


/* =========================
   FIREBASE
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCyClGyrH2ZTFV-UagawzRaDqkmu1AZSXY",

  authDomain:
    "proposal-maker-2caa1.firebaseapp.com",

  projectId:
    "proposal-maker-2caa1",

  storageBucket:
    "proposal-maker-2caa1.firebasestorage.app",

  messagingSenderId:
    "391476539873",

  appId:
    "1:391476539873:web:4e594e6ef7818ddaeda2a0"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);



/* =========================
   GET PROPOSAL ID
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const proposalId =
  params.get("id");



/* =========================
   LOAD PROPOSAL
========================= */

async function loadProposal() {

  if (!proposalId) {

    document
      .getElementById("message")
      .textContent =
      "This proposal link is missing its ID. ❤️";

    return;

  }


  try {

    const proposalRef =
      doc(
        db,
        "proposals",
        proposalId
      );


    const proposalSnap =
      await getDoc(
        proposalRef
      );


    if (!proposalSnap.exists()) {

      document
        .getElementById("message")
        .textContent =
        "Sorry, this proposal could not be found. 💔";

      return;

    }


    const data =
      proposalSnap.data();



    /* NAME */

    if (data.name) {

      document
        .getElementById("name")
        .textContent =
        data.name;

    }



    /* MESSAGE */

    if (data.message) {

      document
        .getElementById("message")
        .textContent =
        data.message;

    }



    /* REASONS */

    const reasonsContainer =
      document
        .getElementById("reasons");


    reasonsContainer.innerHTML =
      "";


    if (
      data.reasons &&
      Array.isArray(data.reasons) &&
      data.reasons.length > 0
    ) {

      data.reasons.forEach(
        function(reason) {

          const div =
            document.createElement("div");

          div.className =
            "reason";

          div.textContent =
            "❤️ " + reason;

          reasonsContainer
            .appendChild(div);

        }
      );

    } else {

      reasonsContainer.innerHTML =
        "<p>❤️ There are some special reasons waiting for you.</p>";

    }



    /* FINAL MESSAGE */

    if (data.finalMessage) {

      document
        .getElementById("finalMessage")
        .textContent =
        data.finalMessage;

    }



    /* PHOTOS */

    loadPhoto(
      "photo1",
      data.photo1
    );

    loadPhoto(
      "photo2",
      data.photo2
    );

    loadPhoto(
      "photo3",
      data.photo3
    );


  } catch (error) {

    console.error(
      "Error loading proposal:",
      error
    );


    document
      .getElementById("message")
      .textContent =
      "Something went wrong loading this proposal. 💔";

  }

}


loadProposal();



/* =========================
   LOAD PHOTO
========================= */

function loadPhoto(
  elementId,
  url
) {

  if (!url) {

    return;

  }


  const img =
    document
      .getElementById(elementId);


  img.src =
    url;


  img.style.display =
    "block";


  img.onerror =
    function() {

      img.style.display =
        "none";

    };

}



/* =========================
   CONTINUE
========================= */

window.showQuestion =
function() {

  document
    .getElementById("page1")
    .classList
    .remove("active");


  document
    .getElementById("page2")
    .classList
    .add("active");


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

};



/* =========================
   NO BUTTON
========================= */

let noClicks = 0;


window.sayNo =
function() {

  noClicks++;


  const noButton =
    document
      .getElementById("noButton");


  const yesButton =
    document
      .getElementById("yesButton");



  /* NO GETS SMALLER */

  const noScale =
    Math.max(
      1 - noClicks * 0.12,
      0.15
    );


  noButton.style.transform =
    `scale(${noScale})`;



  /* YES GETS BIGGER */

  const yesScale =
    Math.min(
      1 + noClicks * 0.12,
      2.5
    );


  yesButton.style.transform =
    `scale(${yesScale})`;



  /* MOVE NO */

  const x =
    Math.random() * 220 - 110;


  const y =
    Math.random() * 140 - 70;


  noButton.style.marginLeft =
    x + "px";


  noButton.style.marginTop =
    y + "px";



  /* CHANGE TEXT */

  if (noClicks === 3) {

    noButton.textContent =
      "Are you sure? 🥺";

  }


  if (noClicks === 6) {

    noButton.textContent =
      "Really? 😭";

  }


  if (noClicks === 9) {

    noButton.textContent =
      "No 😭";

  }


};



/* =========================
   YES
========================= */

window.sayYes =
function() {

  document
    .getElementById("page2")
    .classList
    .remove("active");


  document
    .getElementById("successPage")
    .classList
    .add("active");


  createHearts();


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

};



/* =========================
   HEARTS
========================= */

function createHearts() {

  for (
    let i = 0;
    i < 35;
    i++
  ) {

    const heart =
      document.createElement("div");


    heart.className =
      "floating";


    heart.textContent =
      "❤️";


    heart.style.left =
      Math.random() * 100 +
      "vw";


    heart.style.bottom =
      "-30px";


    heart.style.animationDelay =
      Math.random() * 2 +
      "s";


    document.body
      .appendChild(heart);


    setTimeout(
      function() {

        heart.remove();

      },
      6000
    );

  }

}


</script>

</body>

</html>
