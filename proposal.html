<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>A Special Proposal ❤️</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #fff0f5,
        #ffe1eb
      );
      color: #333;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 18px 60px;
    }


    /* =========================
       PAGES
    ========================= */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      text-align: center;
      padding: 25px 10px;
    }

    .heart {
      font-size: 55px;
      animation: heartbeat 1.3s infinite;
    }

    @keyframes heartbeat {

      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }

    }

    h1 {
      color: #e91e63;
      font-size: 32px;
    }


    /* =========================
       CARDS
    ========================= */

    .card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 22px;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.08);
    }

    h2 {
      color: #e91e63;
    }

    #message {
      font-size: 18px;
      line-height: 1.7;
      white-space: pre-line;
    }


    /* =========================
       REASONS
    ========================= */

    .reason {
      background: #fff0f5;
      padding: 14px;
      margin: 10px 0;
      border-radius: 14px;
      text-align: left;
      font-size: 16px;
    }


    /* =========================
       PHOTOS
    ========================= */

    .photos {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .photo {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 18px;
      display: none;
    }

    #noPhotos {
      text-align: center;
      color: #888;
    }


    /* =========================
       CONTINUE
    ========================= */

    .continue {
      width: 100%;
      border: none;
      padding: 18px;
      border-radius: 35px;
      background: #e91e63;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }


    /* =========================
       QUESTION PAGE
    ========================= */

    .question-page {

      min-height: 85vh;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

    }

    .question-page h1 {
      font-size: 38px;
    }

    .question-page p {
      font-size: 20px;
      margin-bottom: 45px;
    }


    /* =========================
       BUTTONS
    ========================= */

    .buttons {

      width: 100%;
      min-height: 280px;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 35px;

    }


    .yes {

      background: #e91e63;
      color: white;

      padding: 24px 50px;

      border-radius: 60px;

      font-size: 27px;
      font-weight: bold;

      transition:
        transform 0.25s ease;

    }


    .no {

      background: #ddd;
      color: #333;

      padding: 16px 32px;

      border-radius: 50px;

      font-size: 19px;
      font-weight: bold;

      transition:
        transform 0.25s ease;

    }


    /* =========================
       SUCCESS
    ========================= */

    #success {

      display: none;

      text-align: center;

      margin-top: 20vh;

    }

    #success .heart {
      font-size: 80px;
    }

    #finalMessage {

      font-size: 20px;
      line-height: 1.7;

      white-space: pre-line;

    }


    /* =========================
       FLOATING HEARTS
    ========================= */

    .floating {

      position: fixed;

      pointer-events: none;

      animation:
        floatUp 5s linear forwards;

      font-size: 25px;

    }

    @keyframes floatUp {

      from {

        transform:
          translateY(0);

        opacity: 1;

      }

      to {

        transform:
          translateY(-100vh);

        opacity: 0;

      }

    }

  </style>

</head>


<body>

<div class="container">


  <!-- =========================
       PAGE 1
  ========================== -->

  <div
    id="page1"
    class="page active">


    <div class="hero">

      <div class="heart">
        ❤️
      </div>

      <h1>

        A Special Message For

        <span id="name">
          You
        </span>

      </h1>

    </div>


    <!-- MESSAGE -->

    <div class="card">

      <h2>
        💌 Something I Want To Tell You
      </h2>

      <p id="message">
        Your special message will appear here.
      </p>

    </div>


    <!-- REASONS -->

    <div
      class="card"
      id="reasonsCard">

      <h2>
        ❤️ Reasons
      </h2>

      <div id="reasons"></div>

    </div>


    <!-- PHOTOS -->

    <div class="card">

      <h2>
        📸 Memories
      </h2>

      <div class="photos">

        <img
          id="photo1"
          class="photo">

        <img
          id="photo2"
          class="photo">

        <img
          id="photo3"
          class="photo">

      </div>


      <p id="noPhotos">
        Your memories will appear here ❤️
      </p>

    </div>


    <!-- CONTINUE ONLY -->

    <button
      class="continue"
      onclick="goToPage2()">

      Continue ❤️

    </button>


  </div>



  <!-- =========================
       PAGE 2
  ========================== -->

  <div
    id="page2"
    class="page">


    <div class="question-page">


      <div
        class="heart"
        style="font-size:70px;">

        💕

      </div>


      <h1>
        Will you be my girlfriend?
      </h1>


      <p>
        There's only one question left... ❤️
      </p>


      <div class="buttons">


        <button
          id="yesButton"
          class="yes"
          onclick="sayYes()">

          YES ❤️

        </button>


        <button
          id="noButton"
          class="no"
          onclick="sayNo()">

          NO

        </button>


      </div>


    </div>


  </div>



  <!-- =========================
       SUCCESS
  ========================== -->

  <div
    id="success"
    class="card">


    <div class="heart">
      💖
    </div>


    <h1>
      YAY!!! 🎉
    </h1>


    <p id="finalMessage">
      Congratulations! ❤️
    </p>


    <p style="font-size:30px;">
      ❤️ 💕 ❤️ 💕 ❤️
    </p>


  </div>


</div>



<script type="module">


/* =========================
   FIREBASE
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCyClGyrH2ZTFV-UagawzRaDqmu1AZSXY",

  authDomain:
    "proposal-maker-2caa1.firebaseapp.com",

  projectId:
    "proposal-maker-2caa1",

  storageBucket:
    "proposal-maker-2caa1.firebasestorage.app",

  messagingSenderId:
    "391476539873",

  appId:
    "1:391476539873:web:4e594e6ef7818ddaeda2a0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);



/* =========================
   GET ID
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const proposalId =
  params.get("id");



/* =========================
   LOAD PROPOSAL
========================= */

async function loadProposal() {

  if (!proposalId) {

    alert(
      "No proposal ID found."
    );

    return;

  }


  try {

    const proposalRef =
      doc(
        db,
        "proposals",
        proposalId
      );


    const proposalSnap =
      await getDoc(
        proposalRef
      );


    if (!proposalSnap.exists()) {

      alert(
        "This proposal could not be found."
      );

      return;

    }


    const data =
      proposalSnap.data();


    /* NAME */

    if (data.name) {

      document
        .getElementById("name")
        .textContent =
        data.name;

    }


    /* MESSAGE */

    if (data.message) {

      document
        .getElementById("message")
        .textContent =
        data.message;

    }


    /* REASONS */

    const reasonsContainer =
      document
        .getElementById("reasons");


    if (
      data.reasons &&
      data.reasons.length > 0
    ) {

      data.reasons.forEach(
        function(reason) {

          const div =
            document.createElement(
              "div"
            );

          div.className =
            "reason";

          div.textContent =
            "❤️ " + reason;

          reasonsContainer
            .appendChild(div);

        }
      );

    }
    else {

      document
        .getElementById(
          "reasonsCard"
        )
        .style.display =
        "none";

    }


    /* FINAL MESSAGE */

    if (data.finalMessage) {

      document
        .getElementById(
          "finalMessage"
        )
        .textContent =
        data.finalMessage;

    }


    /* =========================
       PHOTOS
    ========================= */

    let photoFound = false;


    function showPhoto(
      elementId,
      photoData
    ) {

      if (
        !photoData ||
        photoData === null
      ) {

        return;

      }


      const img =
        document.getElementById(
          elementId
        );


      img.src =
        photoData;


      img.style.display =
        "block";


      photoFound = true;

    }


    showPhoto(
      "photo1",
      data.photo1
    );


    showPhoto(
      "photo2",
      data.photo2
    );


    showPhoto(
      "photo3",
      data.photo3
    );


    if (photoFound) {

      document
        .getElementById(
          "noPhotos"
        )
        .style.display =
        "none";

    }

  }


  catch (error) {

    console.error(
      "Error loading proposal:",
      error
    );

    alert(
      "Something went wrong loading the proposal."
    );

  }

}



/* =========================
   PAGE 1 → PAGE 2
========================= */

window.goToPage2 =
function() {

  document
    .getElementById("page1")
    .classList
    .remove("active");


  document
    .getElementById("page2")
    .classList
    .add("active");


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

};



/* =========================
   NO BUTTON
========================= */

let noClicks = 0;

let yesScale = 1;

let noScale = 1;


window.sayNo =
function() {

  noClicks++;


  yesScale += 0.18;

  noScale -= 0.12;


  if (noScale < 0.25) {

    noScale = 0.25;

  }


  const yesButton =
    document.getElementById(
      "yesButton"
    );


  const noButton =
    document.getElementById(
      "noButton"
    );


  yesButton.style.transform =
    `scale(${yesScale})`;


  noButton.style.transform =
    `scale(${noScale})`;


  if (noClicks >= 6) {

    yesButton.textContent =
      "YES ❤️ PLEASE";

  }

};



/* =========================
   YES
========================= */

window.sayYes =
function() {

  document
    .getElementById("page2")
    .style.display =
    "none";


  document
    .getElementById("success")
    .style.display =
    "block";


  createHearts();


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

};



/* =========================
   HEARTS
========================= */

function createHearts() {

  for (
    let i = 0;
    i < 30;
    i++
  ) {

    const heart =
      document.createElement(
        "div"
      );


    heart.className =
      "floating";


    heart.textContent =
      "❤️";


    heart.style.left =
      Math.random() * 100 +
      "vw";


    heart.style.bottom =
      "-30px";


    heart.style.animationDelay =
      Math.random() * 2 +
      "s";


    document.body
      .appendChild(heart);


    setTimeout(
      function() {

        heart.remove();

      },
      6000
    );

  }

}



/* =========================
   START
========================= */

loadProposal();

</script>

</body>

</html>
