<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>A Special Proposal ❤️</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #fff0f5,
        #ffe1eb
      );
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 18px 60px;
    }

    .hero {
      text-align: center;
      padding: 25px 10px;
    }

    .heart {
      font-size: 55px;
      animation: heartbeat 1.3s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    h1 {
      color: #e91e63;
      font-size: 32px;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 22px;
      box-shadow:
        0 8px 25px rgba(0,0,0,0.08);
    }

    h2 {
      color: #e91e63;
    }

    #message {
      font-size: 18px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .reason {
      background: #fff0f5;
      padding: 14px;
      margin: 10px 0;
      border-radius: 14px;
      text-align: left;
      font-size: 16px;
    }

    .photos {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .photo {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 18px;
      display: none;
    }

    .question {
      text-align: center;
    }

    .question h2 {
      color: #e91e63;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 25px;
      min-height: 60px;
    }

    button {
      border: none;
      padding: 13px 24px;
      border-radius: 30px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.25s;
    }

    .yes {
      background: #e91e63;
      color: white;
    }

    .yes:hover {
      transform: scale(1.05);
    }

    .no {
      background: #ddd;
      color: #333;
    }

    #success {
      display: none;
      text-align: center;
    }

    #finalMessage {
      font-size: 19px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .floating {
      position: fixed;
      pointer-events: none;
      animation: floatUp 5s linear forwards;
      font-size: 20px;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 1;
      }

      to {
        transform: translateY(-100vh);
        opacity: 0;
      }
    }

  </style>

</head>


<body>

<div class="container">


  <div class="hero">

    <div class="heart">❤️</div>

    <h1>
      A Special Message For
      <span id="name">You</span>
    </h1>

  </div>


  <div class="card">

    <h2>💌 Something I Want To Tell You</h2>

    <p id="message">
      Loading your special message... ❤️
    </p>

  </div>


  <div class="card">

    <h2>❤️ Reasons</h2>

    <div id="reasons">
      <p>Loading reasons... ❤️</p>
    </div>

  </div>


  <div class="card">

    <h2>📸 Memories</h2>

    <div class="photos">

      <img id="photo1" class="photo">

      <img id="photo2" class="photo">

      <img id="photo3" class="photo">

    </div>

  </div>


  <div class="card question">

    <h2>
      Will you be my girlfriend? 💕
    </h2>

    <div class="buttons">

      <button
        class="yes"
        onclick="sayYes()">

        Yes ❤️

      </button>

      <button
        class="no"
        id="noButton"
        onclick="sayNo()">

        No

      </button>

    </div>

  </div>


  <div class="card" id="success">

    <div class="heart">
      💖
    </div>

    <h1>
      YAY!!! 🎉
    </h1>

    <p id="finalMessage">
      Congratulations!
    </p>

    <p>
      ❤️ 💕 ❤️ 💕 ❤️
    </p>

  </div>


</div>


<script type="module">


/* =========================
   FIREBASE
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCyClGyrH2ZTFV-UagawzRaDqkmu1AZSXY",

  authDomain:
    "proposal-maker-2caa1.firebaseapp.com",

  projectId:
    "proposal-maker-2caa1",

  storageBucket:
    "proposal-maker-2caa1.firebasestorage.app",

  messagingSenderId:
    "391476539873",

  appId:
    "1:391476539873:web:4e594e6ef7818ddaeda2a0"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);



/* =========================
   GET PROPOSAL ID
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const proposalId =
  params.get("id");


/* =========================
   LOAD PROPOSAL
========================= */

async function loadProposal() {

  if (!proposalId) {

    document.getElementById("message")
      .textContent =
      "This proposal link is missing its ID. ❤️";

    return;

  }


  try {

    const proposalRef =
      doc(
        db,
        "proposals",
        proposalId
      );


    const proposalSnap =
      await getDoc(proposalRef);


    if (!proposalSnap.exists()) {

      document.getElementById("message")
        .textContent =
        "Sorry, this proposal could not be found. 💔";

      return;

    }


    const data =
      proposalSnap.data();



    /* NAME */

    if (data.name) {

      document
        .getElementById("name")
        .textContent =
        data.name;

    }



    /* MESSAGE */

    if (data.message) {

      document
        .getElementById("message")
        .textContent =
        data.message;

    }



    /* REASONS */

    const reasonsContainer =
      document
        .getElementById("reasons");


    reasonsContainer.innerHTML = "";


    if (
      data.reasons &&
      Array.isArray(data.reasons)
    ) {

      data.reasons.forEach(
        function(reason) {

          const div =
            document.createElement("div");

          div.className =
            "reason";

          div.textContent =
            "❤️ " + reason;

          reasonsContainer
            .appendChild(div);

        }
      );

    }



    /* FINAL MESSAGE */

    if (data.finalMessage) {

      document
        .getElementById("finalMessage")
        .textContent =
        data.finalMessage;

    }


  } catch (error) {

    console.error(
      "Error loading proposal:",
      error
    );


    document
      .getElementById("message")
      .textContent =
      "Something went wrong loading this proposal. 💔";

  }

}


loadProposal();



/* =========================
   YES
========================= */

window.sayYes =
function() {

  document
    .getElementById("success")
    .style.display =
    "block";


  createHearts();


  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

};



/* =========================
   NO BUTTON
========================= */

let noClicks = 0;


window.sayNo =
function() {

  const button =
    document.getElementById("noButton");


  noClicks++;


  const maxX =
    Math.min(
      150 + noClicks * 10,
      220
    );


  const maxY =
    Math.min(
      60 + noClicks * 5,
      100
    );


  const x =
    Math.random() * maxX -
    maxX / 2;


  const y =
    Math.random() * maxY -
    maxY / 2;


  const scale =
    Math.max(
      1 - noClicks * 0.12,
      0.35
    );


  button.style.transform =
    `translate(${x}px, ${y}px) scale(${scale})`;


  if (noClicks >= 6) {

    button.textContent =
      "No? 🥺";


  }


  if (noClicks >= 9) {

    button.textContent =
      "Okay... 😭";

  }

};



/* =========================
   HEARTS
========================= */

function createHearts() {

  for (
    let i = 0;
    i < 20;
    i++
  ) {

    const heart =
      document.createElement("div");


    heart.className =
      "floating";


    heart.textContent =
      "❤️";


    heart.style.left =
      Math.random() * 100 +
      "vw";


    heart.style.bottom =
      "-30px";


    heart.style.animationDelay =
      Math.random() * 2 +
      "s";


    document.body
      .appendChild(heart);


    setTimeout(
      function() {

        heart.remove();

      },
      6000
    );

  }

}


</script>

</body>

</html>
