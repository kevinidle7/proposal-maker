<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Proposal Maker 💌</title>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(
        135deg,
        #fff0f5,
        #ffe1eb
      );
      color: #333;
    }

    .container {
      max-width: 750px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    h1 {
      text-align: center;
      color: #e91e63;
      font-family: 'Pacifico', cursive;
      font-size: 36px;
      font-weight: 400;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h2 {
      color: #e91e63;
      margin-top: 0;
      font-weight: 700;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 2px solid #f3c5d4;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #e91e63;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .photo-box {
      margin-top: 15px;
      padding: 18px;
      border: 2px dashed #f3c5d4;
      border-radius: 15px;
      text-align: center;
    }

    .photo-preview {
      display: none;
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      margin-top: 12px;
      border-radius: 15px;
    }

    .photo-note {
      font-size: 13px;
      color: #777;
      text-align: center;
      margin-top: 15px;
    }

    .generate {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 30px;
      background: #e91e63;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .generate:hover {
      transform: scale(1.02);
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #fff0f5;
      border-radius: 15px;
    }

    #link {
      word-break: break-all;
      font-size: 14px;
      color: #e91e63;
      line-height: 1.5;
    }

    .copy {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 25px;
      background: #333;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      cursor: pointer;
    }

    .success-text {
      text-align: center;
      color: #e91e63;
      font-weight: 600;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>💌 Proposal Maker</h1>

  <p class="subtitle">
    Create a cute surprise for someone special ❤️
  </p>


  <!-- PERSONAL INFORMATION -->

  <div class="card">

    <h2>✨ Step 1 — Make It Personal</h2>

    <label>Her Name 💕</label>

    <input
      id="name"
      type="text"
      placeholder="e.g. Sarah">


    <label>Your Email 📩</label>

    <input
      id="creatorEmail"
      type="email"
      placeholder="your@email.com">


    <label>Your Special Message 💌</label>

    <textarea
      id="message"
      placeholder="Write something from your heart..."></textarea>


    <label>Reason #1 ❤️</label>

    <input
      id="reason1"
      type="text"
      placeholder="One thing you love about her">


    <label>Reason #2 ❤️</label>

    <input
      id="reason2"
      type="text"
      placeholder="Another reason">


    <label>Reason #3 ❤️</label>

    <input
      id="reason3"
      type="text"
      placeholder="Another reason">


    <label>Reason #4 ❤️</label>

    <input
      id="reason4"
      type="text"
      placeholder="Another reason">


    <label>Reason #5 ❤️</label>

    <input
      id="reason5"
      type="text"
      placeholder="Another reason">

  </div>


  <!-- PHOTOS -->

  <div class="card">

    <h2>📸 Step 2 — Add Your Photos</h2>


    <div class="photo-box">

      <label>Photo 1</label>

      <input
        id="photo1"
        type="file"
        accept="image/*">

      <img
        id="preview1"
        class="photo-preview">

    </div>


    <div class="photo-box">

      <label>Photo 2</label>

      <input
        id="photo2"
        type="file"
        accept="image/*">

      <img
        id="preview2"
        class="photo-preview">

    </div>


    <div class="photo-box">

      <label>Photo 3</label>

      <input
        id="photo3"
        type="file"
        accept="image/*">

      <img
        id="preview3"
        class="photo-preview">

    </div>


    <p class="photo-note">
      📱 Tap a box to choose a photo from your gallery.
    </p>

  </div>


  <!-- FINAL MESSAGE -->

  <div class="card">

    <h2>🎉 Step 3 — The YES Message</h2>


    <label>
      Message after she presses YES ❤️
    </label>


    <textarea
      id="final"
      placeholder="Write your congratulations message..."></textarea>


    <button
      class="generate"
      onclick="generateLink()">

      💕 Generate My Proposal

    </button>


    <div id="result">

      <h3>🎉 Your proposal is ready!</h3>

      <p class="success-text">
        Send this link to her ❤️
      </p>

      <p id="link"></p>


      <button
        class="copy"
        onclick="copyLink()">

        📋 Copy Proposal Link

      </button>

    </div>

  </div>

</div>


<script>


/* PHOTO PREVIEW */

function previewPhoto(inputId, previewId) {

  const input =
    document.getElementById(inputId);

  const preview =
    document.getElementById(previewId);


  input.addEventListener(
    "change",
    function() {

      const file =
        this.files[0];


      if (!file) {

        preview.style.display = "none";

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          preview.src =
            event.target.result;

          preview.style.display =
            "block";

        };


      reader.readAsDataURL(file);

    }
  );

}


previewPhoto("photo1", "preview1");

previewPhoto("photo2", "preview2");

previewPhoto("photo3", "preview3");



/* GENERATE LINK */

function generateLink() {


  const creatorEmail =
    document
      .getElementById("creatorEmail")
      .value
      .trim();


  if (!creatorEmail) {

    alert(
      "Please enter your email so you can know when she says YES ❤️"
    );

    return;

  }


  const params =
    new URLSearchParams();


  params.set(
    "name",
    document
      .getElementById("name")
      .value
  );


  params.set(
    "email",
    creatorEmail
  );


  params.set(
    "message",
    document
      .getElementById("message")
      .value
  );


  const reasons = [

    document
      .getElementById("reason1")
      .value,

    document
      .getElementById("reason2")
      .value,

    document
      .getElementById("reason3")
      .value,

    document
      .getElementById("reason4")
      .value,

    document
      .getElementById("reason5")
      .value

  ].filter(

    reason =>
      reason.trim() !== ""

  );


  params.set(
    "reasons",
    reasons.join("||")
  );


  params.set(
    "final",
    document
      .getElementById("final")
      .value
  );


  const link =
    window.location.origin +
    "/proposal-maker/proposal.html?" +
    params.toString();


  document
    .getElementById("link")
    .textContent = link;


  document
    .getElementById("result")
    .style.display = "block";


  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

}



/* COPY LINK */

function copyLink() {


  const link =
    document
      .getElementById("link")
      .textContent;


  if (!link) {

    return;

  }


  navigator
    .clipboard
    .writeText(link)
    .then(function() {

      alert(
        "Proposal link copied! 💕"
      );

    })
    .catch(function() {

      alert(
        "Please copy the link manually."
      );

    });

}
