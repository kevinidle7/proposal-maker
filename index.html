<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Proposal Maker 💌</title>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffe1eb);
      color: #333;
    }

    .container {
      max-width: 750px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    h1 {
      text-align: center;
      color: #e91e63;
      font-family: 'Pacifico', cursive;
      font-size: 36px;
      font-weight: 400;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h2 {
      color: #e91e63;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 2px solid #f3c5d4;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #e91e63;
    }

    .photo-box {
      margin-top: 15px;
      padding: 18px;
      border: 2px dashed #f3c5d4;
      border-radius: 15px;
      text-align: center;
    }

    .photo-preview {
      display: none;
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      margin-top: 12px;
      border-radius: 15px;
    }

    .photo-note {
      font-size: 13px;
      color: #777;
      text-align: center;
      margin-top: 15px;
    }

    .generate {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 30px;
      background: #e91e63;
      color: white;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
    }

    .generate:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #fff0f5;
      border-radius: 15px;
    }

    #link {
      word-break: break-all;
      font-size: 14px;
      color: #e91e63;
      line-height: 1.5;
    }

    .copy {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 25px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .success-text {
      text-align: center;
      color: #e91e63;
      font-weight: 600;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>💌 Proposal Maker</h1>

  <p class="subtitle">
    Create a cute surprise for someone special ❤️
  </p>


  <!-- STEP 1 -->

  <div class="card">

    <h2>✨ Step 1 — Make It Personal</h2>

    <label>Her Name 💕</label>

    <input
      id="name"
      type="text"
      placeholder="e.g. Sarah">


    <label>Your Email 📩</label>

    <input
      id="creatorEmail"
      type="email"
      placeholder="your@email.com">


    <label>Your Special Message 💌</label>

    <textarea
      id="message"
      placeholder="Write something from your heart..."></textarea>


    <label>Reason #1 ❤️</label>
    <input id="reason1" type="text" placeholder="One thing you love about her">


    <label>Reason #2 ❤️</label>
    <input id="reason2" type="text" placeholder="Another reason">


    <label>Reason #3 ❤️</label>
    <input id="reason3" type="text" placeholder="Another reason">


    <label>Reason #4 ❤️</label>
    <input id="reason4" type="text" placeholder="Another reason">


    <label>Reason #5 ❤️</label>
    <input id="reason5" type="text" placeholder="Another reason">

  </div>


  <!-- STEP 2 -->

  <div class="card">

    <h2>📸 Step 2 — Add Your Photos</h2>


    <div class="photo-box">

      <label>Photo 1</label>

      <input
        id="photo1"
        type="file"
        accept="image/*">

      <img
        id="preview1"
        class="photo-preview">

    </div>


    <div class="photo-box">

      <label>Photo 2</label>

      <input
        id="photo2"
        type="file"
        accept="image/*">

      <img
        id="preview2"
        class="photo-preview">

    </div>


    <div class="photo-box">

      <label>Photo 3</label>

      <input
        id="photo3"
        type="file"
        accept="image/*">

      <img
        id="preview3"
        class="photo-preview">

    </div>


    <p class="photo-note">
      📱 Photos are automatically compressed before saving.
    </p>

  </div>


  <!-- STEP 3 -->

  <div class="card">

    <h2>🎉 Step 3 — The YES Message</h2>

    <label>
      Message after she presses YES ❤️
    </label>

    <textarea
      id="final"
      placeholder="Write your congratulations message..."></textarea>


    <button
      id="generateButton"
      class="generate"
      onclick="generateLink()">

      💕 Generate My Proposal

    </button>


    <div id="result">

      <h3>🎉 Your proposal is ready!</h3>

      <p class="success-text">
        Send this link to her ❤️
      </p>

      <p id="link"></p>

      <button
        class="copy"
        onclick="copyLink()">

        📋 Copy Proposal Link

      </button>

    </div>

  </div>

</div>



<script type="module">

/* =================================
   FIREBASE
================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCyClGyrH2ZTFV-UagawzRaDqkmu1AZSXY",

  authDomain:
    "proposal-maker-2caa1.firebaseapp.com",

  projectId:
    "proposal-maker-2caa1",

  storageBucket:
    "proposal-maker-2caa1.firebasestorage.app",

  messagingSenderId:
    "391476539873",

  appId:
    "1:391476539873:web:4e594e6ef7818ddaeda2a0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);



/* =================================
   PHOTO PREVIEW
================================= */

function previewPhoto(inputId, previewId) {

  const input =
    document.getElementById(inputId);

  const preview =
    document.getElementById(previewId);


  input.addEventListener(
    "change",
    function() {

      const file =
        this.files[0];


      if (!file) {

        preview.style.display =
          "none";

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          preview.src =
            event.target.result;

          preview.style.display =
            "block";

        };


      reader.readAsDataURL(file);

    }
  );

}


previewPhoto("photo1", "preview1");
previewPhoto("photo2", "preview2");
previewPhoto("photo3", "preview3");



/* =================================
   COMPRESS PHOTO
================================= */

function compressPhoto(file) {

  if (!file) {
    return Promise.resolve(null);
  }


  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const img =
            new Image();


          img.onload =
            function() {

              const maxSize = 700;

              let width =
                img.width;

              let height =
                img.height;


              if (
                width > maxSize ||
                height > maxSize
              ) {

                if (width > height) {

                  height =
                    height *
                    (maxSize / width);

                  width =
                    maxSize;

                }
                else {

                  width =
                    width *
                    (maxSize / height);

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext("2d");


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const compressed =
                canvas.toDataURL(
                  "image/jpeg",
                  0.55
                );


              resolve(compressed);

            };


          img.onerror =
            function() {

              reject(
                new Error(
                  "Could not process image."
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Could not read image."
            )
          );

        };


      reader.readAsDataURL(file);

    }
  );

}



/* =================================
   GENERATE LINK
================================= */

async function generateLink() {

  const creatorEmail =
    document
      .getElementById("creatorEmail")
      .value
      .trim();


  if (!creatorEmail) {

    alert(
      "Please enter your email ❤️"
    );

    return;

  }


  const generateButton =
    document.getElementById(
      "generateButton"
    );


  generateButton.disabled =
    true;

  generateButton.textContent =
    "⏳ Creating your proposal...";


  try {

    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const message =
      document
        .getElementById("message")
        .value
        .trim();


    const reasons = [

      document
        .getElementById("reason1")
        .value
        .trim(),

      document
        .getElementById("reason2")
        .value
        .trim(),

      document
        .getElementById("reason3")
        .value
        .trim(),

      document
        .getElementById("reason4")
        .value
        .trim(),

      document
        .getElementById("reason5")
        .value
        .trim()

    ].filter(
      reason => reason !== ""
    );


    const finalMessage =
      document
        .getElementById("final")
        .value
        .trim();


    /* GET PHOTO FILES */

    const photo1File =
      document
        .getElementById("photo1")
        .files[0];

    const photo2File =
      document
        .getElementById("photo2")
        .files[0];

    const photo3File =
      document
        .getElementById("photo3")
        .files[0];


    /* COMPRESS PHOTOS */

    const photo1 =
      await compressPhoto(photo1File);

    const photo2 =
      await compressPhoto(photo2File);

    const photo3 =
      await compressPhoto(photo3File);


    /* SAVE EVERYTHING */

    const docRef =
      await addDoc(
        collection(db, "proposals"),
        {

          name:
            name,

          creatorEmail:
            creatorEmail,

          message:
            message,

          reasons:
            reasons,

          finalMessage:
            finalMessage,

          photo1:
            photo1,

          photo2:
            photo2,

          photo3:
            photo3,

          createdAt:
            new Date().toISOString()

        }
      );


    /* CREATE LINK */

    const link =
      window.location.origin +
      "/proposal-maker/proposal.html?id=" +
      docRef.id;


    document
      .getElementById("link")
      .textContent =
      link;


    document
      .getElementById("result")
      .style.display =
      "block";


    window.scrollTo({

      top:
        document.body.scrollHeight,

      behavior:
        "smooth"

    });


    generateButton.disabled =
      false;

    generateButton.textContent =
      "💕 Generate My Proposal";

  }


  catch (error) {

    console.error(
      "Firebase error:",
      error
    );


    alert(
      "Something went wrong. Please try again."
    );


    generateButton.disabled =
      false;

    generateButton.textContent =
      "💕 Generate My Proposal";

  }

}



/* =================================
   COPY LINK
================================= */

function copyLink() {

  const link =
    document
      .getElementById("link")
      .textContent;


  if (!link) {
    return;
  }


  navigator.clipboard
    .writeText(link)
    .then(
      function() {

        alert(
          "Proposal link copied! 💕"
        );

      }
    )
    .catch(
      function() {

        alert(
          "Please copy the link manually."
        );

      }
    );

}


window.generateLink =
  generateLink;

window.copyLink =
  copyLink;

</script>

</body>

</html>
