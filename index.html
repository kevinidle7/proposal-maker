<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal Maker ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff0f5;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      color: #e91e63;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 30px;
      background: #e91e63;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #fce4ec;
      border-radius: 10px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💌 Proposal Maker</h1>

    <div class="card">

      <label>Her Name</label>
      <input id="name" type="text" placeholder="Enter her name">

      <label>Your Message</label>
      <textarea id="message" placeholder="Write your special message..."></textarea>

      <label>Reasons You Love Her</label>
      <textarea id="reasons" placeholder="Write your reasons..."></textarea>

      <label>Congratulations Message</label>
      <textarea id="final" placeholder="Write what she will see after Yes..."></textarea>

      <button onclick="generateLink()">✨ Generate Proposal Link</button>

      <div id="result">
        <strong>Your proposal link:</strong>
        <p id="link"></p>
      </div>

    </div>

  </div>

  <script>
    function generateLink() {
      const name = document.getElementById("name").value;
      const message = document.getElementById("message").value;
      const reasons = document.getElementById("reasons").value;
      const final = document.getElementById("final").value;

      const params = new URLSearchParams();

      params.set("name", name);
      params.set("message", message);
      params.set("reasons", reasons);
      params.set("final", final);

      const link =
        window.location.origin +
        "/proposal-maker/proposal.html?" +
        params.toString();

      document.getElementById("link").textContent = link;
      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
