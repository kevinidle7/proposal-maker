<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal Maker ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <h1>💌 Make Your Proposal</h1>
    <p class="subtitle">Alright, let's make this one special 👀❤️</p>

    <label>Your name</label>
    <input id="yourName" type="text" placeholder="e.g. Kevin">

    <label>Who got you feeling like this? 👀</label>
    <input id="theirName" type="text" placeholder="e.g. Hailey">

    <label>Say what's on your mind 💭</label>
    <textarea id="message" placeholder="Write something from the heart..."></textarea>

    <label>Why are you so down bad for them? 😭❤️</label>

    <input class="reason" type="text" placeholder="I love you because... ❤️">
    <input class="reason" type="text" placeholder="You always make me... 🥹">
    <input class="reason" type="text" placeholder="I love the way you... 👀❤️">

    <label>Drop some memories 📸</label>
    <input id="photos" type="file" accept="image/*" multiple>

    <p class="photo-limit">📸 Pick up to 5 memories</p>

    <button id="create">LET'S MAKE IT HAPPEN ❤️</button>

  </div>

  <script src="script.js"></script>

</body>
</html>
