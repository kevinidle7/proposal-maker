<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal Maker 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffe1eb);
      color: #333;
    }

    .container {
      max-width: 750px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    h1 {
      text-align: center;
      color: #e91e63;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h2 {
      color: #e91e63;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 2px solid #f3c5d4;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #e91e63;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .photo-box {
      margin-top: 10px;
      padding: 18px;
      border: 2px dashed #f3c5d4;
      border-radius: 15px;
      text-align: center;
    }

    .photo-preview {
      display: none;
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      margin-top: 12px;
      border-radius: 15px;
    }

    .photo-note {
      font-size: 13px;
      color: #777;
    }

    .generate {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 30px;
      background: #e91e63;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #fff0f5;
      border-radius: 15px;
    }

    #link {
      word-break: break-all;
      font-size: 14px;
      color: #e91e63;
    }

    .copy {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 25px;
      background: #333;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💌 Proposal Maker</h1>

  <p class="subtitle">
    Create a cute surprise for someone special ❤️
  </p>

  <div class="card">

    <h2>✨ Step 1 — Make It Personal</h2>

    <label>Her Name 💕</label>
    <input id="name" type="text" placeholder="e.g. Sarah">

    <label>Your Special Message 💌</label>
    <textarea id="message"
      placeholder="Write something from your heart..."></textarea>

    <label>Reason #1 ❤️</label>
    <input id="reason1" type="text"
      placeholder="One thing you love about her">

    <label>Reason #2 ❤️</label>
    <input id="reason2" type="text"
      placeholder="Another reason">

    <label>Reason #3 ❤️</label>
    <input id="reason3" type="text"
      placeholder="Another reason">

    <label>Reason #4 ❤️</label>
    <input id="reason4" type="text"
      placeholder="Another reason">

    <label>Reason #5 ❤️</label>
    <input id="reason5" type="text"
      placeholder="Another reason">

  </div>

  <div class="card">

    <h2>📸 Step 2 — Add Your Photos</h2>

    <div class="photo-box">
      <label>Photo 1</label>
      <input id="photo1" type="file" accept="image/*">
      <img id="preview1" class="photo-preview">
    </div>

    <div class="photo-box">
      <label>Photo 2</label>
      <input id="photo2" type="file" accept="image/*">
      <img id="preview2" class="photo-preview">
    </div>

    <div class="photo-box">
      <label>Photo 3</label>
      <input id="photo3" type="file" accept="image/*">
      <img id="preview3" class="photo-preview">
    </div>

    <p class="photo-note">
      📱 Tap the box
