<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal Maker 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffe4ec);
      color: #333;
    }

    .container {
      max-width: 750px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    h1 {
      text-align: center;
      color: #e91e63;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h2 {
      color: #e91e63;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 2px solid #f3c5d4;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #e91e63;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .reason {
      margin-bottom: 10px;
    }

    .photo-note {
      font-size: 13px;
      color: #777;
      margin-top: 6px;
    }

    .generate {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 30px;
      background: #e91e63;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(233,30,99,0.25);
    }

    .generate:hover {
      transform: scale(1.02);
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #fff0f5;
      border-radius: 15px;
    }

    #link {
      word-break: break-all;
      font-size: 14px;
      color: #e91e63;
    }

    .copy {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 25px;
      background: #333;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💌 Proposal Maker</h1>
  <p class="subtitle">
    Create a cute little surprise for someone special ❤️
  </p>

  <div class="card">

    <h2>✨ Step 1 — Make It Personal</h2>

    <label>Her Name 💕</label>
    <input id="name" type="text" placeholder="e.g. Sarah">

    <label>Your Special Message 💌</label>
    <textarea id="message"
      placeholder="Write something from your heart..."></textarea>

    <label>Reason #1 ❤️</label>
    <input class="reason" id="reason1"
      placeholder="One thing you love about her">

    <label>Reason #2 ❤️</label>
    <input class="reason" id="reason2"
      placeholder="Another reason">

    <label>Reason #3 ❤️</label>
    <input class="reason" id="reason3"
      placeholder="Another reason">


  </div>


  <div class="card">

    <h2>📸 Step 2 — Add Your Photos</h2>

    <label>Photo 1 📸</label>
<input id="photo1" type="file" accept="image/*">

<label>Photo 2 📸</label>
<input id="photo2" type="file" accept="image/*">

<label>Photo 3 📸</label>
<input id="photo3" type="file" accept="image/*">

    <p class="photo-note">
      💡 Use a direct image URL ending in .jpg, .png, .jpeg, or .webp.
    </p>

  </div>


  <div class="card">

    <h2>🎉 Step 3 — The Yes Message</h2>

    <label>Message after she presses YES ❤️</label>

    <textarea id="final"
      placeholder="Write your congratulations message..."></textarea>

    <button class="generate" onclick="generateLink()">
      💕 Generate My Proposal
    </button>

    <div id="result">

      <h3>🎉 Your proposal is ready!</h3>

      <p id="link"></p>

      <button class="copy" onclick="copyLink()">
        📋 Copy Proposal Link
      </button>

    </div>

  </div>

</div>


<script>

function generateLink() {

  const params = new URLSearchParams();

  params.set(
    "name",
    document.getElementById("name").value
  );

  params.set(
    "message",
    document.getElementById("message").value
  );

  const reasons = [
    document.getElementById("reason1").value,
    document.getElementById("reason2").value,
    document.getElementById("reason3").value,
    document.getElementById("reason4").value,
    document.getElementById("reason5").value
  ].filter(reason => reason.trim() !== "");

  params.set("reasons", reasons.join("||"));

  params.set(
    "photo1",
    document.getElementById("photo1").value
  );

  params.set(
    "photo2",
    document.getElementById("photo2").value
  );

  params.set(
    "photo3",
    document.getElementById("photo3").value
  );

  params.set(
    "final",
    document.getElementById("final").value
  );

  const link =
    window.location.origin +
    "/proposal-maker/proposal.html?" +
    params.toString();

  document.getElementById("link").textContent = link;

  document.getElementById("result").style.display = "block";

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}


function copyLink() {

  const link =
    document.getElementById("link").textContent;

  navigator.clipboard.writeText(link);

  alert("Proposal link copied! 💕");

}

</script>

</body>
</html>
